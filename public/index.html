<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wayang Kancil Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-gray-900 text-white overflow-hidden">

  <!-- Lobby / Waiting Room -->
  <div id="lobby" class="fixed inset-0 z-10 flex flex-col items-center justify-center bg-cover bg-center" style="background-image: url('/assets/background/kelir-bg.png');">
    <h1 class="text-6xl font-black text-yellow-300 drop-shadow-[0_0_10px_rgba(255,255,255,0.5)] mb-8">Wayang Kancil</h1>

    <div class="bg-black/60 backdrop-blur-sm p-8 rounded-xl border border-yellow-500/30 shadow-[0_0_30px_rgba(255,213,79,0.2)] w-full max-w-md">
      <h2 class="text-2xl font-bold text-yellow-400 mb-6 text-center">Lobby Game</h2>

      <!-- Player identity -->
      <div class="space-y-4 mb-6">
        <div>
          <label class="block text-sm text-gray-300 mb-1">Nama Pemain</label>
          <input type="text" id="playerName" placeholder="Masukkan nama..." class="w-full px-3 py-2 bg-gray-800 border border-gray-600 rounded text-white focus:outline-none focus:border-yellow-500" />
        </div>

        <div>
          <label class="block text-sm text-gray-300 mb-1">Karakter</label>
          <select id="characterSelect" class="w-full px-3 py-2 bg-gray-800 border border-gray-600 rounded text-white focus:outline-none focus:border-yellow-500">
            <option value="kancil">Si Kancil</option>
            <option value="pak-tani">Pak Tani</option>
            <option value="macan">Macan</option>
            <option value="buaya">Buaya</option>
          </select>
        </div>

        <div>
          <label class="block text-sm text-gray-300 mb-1">Episode Cerita</label>
          <select id="episodeSelect" class="w-full px-3 py-2 bg-gray-800 border border-gray-600 rounded text-white focus:outline-none focus:border-yellow-500">
            <option value="">-- Tanpa Episode (Chase Mode) --</option>
          </select>
        </div>
      </div>

      <!-- Room actions -->
      <div class="grid grid-cols-2 gap-4 mb-6">
        <button id="createRoomBtn" class="py-3 bg-yellow-600 hover:bg-yellow-500 text-white font-bold rounded shadow-[0_0_15px_rgba(255,213,79,0.3)] transition">
          Buat Room
        </button>
        <button id="joinRoomBtn" class="py-3 bg-yellow-500 hover:bg-yellow-400 text-black font-bold rounded shadow-[0_0_15px_rgba(255,213,79,0.4)] transition">
          Gabung Room
        </button>
      </div>

      <!-- Cerita / Story Mode -->
      <div id="storyModeField" class="mb-6 border-t border-gray-700 pt-6">
        <h3 class="text-lg font-bold text-yellow-300 mb-3 text-center">Cerita Si Kancil</h3>
        <button id="storyModeBtn" class="w-full py-3 bg-green-600 hover:bg-green-500 text-white font-bold rounded shadow-[0_0_15px_rgba(34,197,94,0.3)] transition">
          Mode Cerita (Dalang)
        </button>
        <div id="storyList" class="mt-4 hidden space-y-2 max-h-48 overflow-y-auto pr-2">
          <!-- episode list injected here -->
        </div>
      </div>

      <!-- Room ID input -->
      <div id="roomIdField" class="mb-6">
        <label class="block text-sm text-gray-300 mb-1">Room ID</label>
        <div class="flex gap-2">
          <input type="text" id="roomId" placeholder="Ketik Room ID..." class="flex-1 px-3 py-2 bg-gray-800 border border-gray-600 rounded text-white focus:outline-none focus:border-yellow-500" />
          <button id="copyRoomIdBtn" class="px-4 py-2 bg-gray-700 border border-gray-600 rounded text-gray-300 hover:text-white">Salin</button>
        </div>
        <div id="displayRoomId" class="mt-2 text-xs font-mono text-yellow-400 hidden"></div>
      </div>

      <p id="statusMsg" class="text-xs text-red-400 text-center mb-4 hidden"></p>

      <!-- Waiting players list -->
      <div id="waitingRoom" class="hidden">
        <h3 class="text-lg font-bold text-yellow-300 mb-3 text-center">Pemain di Room</h3>
        <div id="playersList" class="space-y-2 mb-4 max-h-40 overflow-y-auto pr-2">
          <!-- players injected here -->
        </div>

        <!-- Voting untuk Cerita (Phase 7.4 Dalang Mode) -->
        <div id="votePanel" class="hidden mb-4 border border-yellow-500/30 rounded-lg p-4 bg-yellow-500/10">
          <h4 class="text-sm font-bold text-yellow-300 mb-2 text-center">🗳️ Pilih Cerita</h4>
          <div id="voteOptions" class="grid grid-cols-2 gap-2 mb-3">
            <!-- vote buttons injected here -->
          </div>
          <div id="voteResults" class="text-xs text-gray-300 text-center mb-2"></div>
        </div>

        <div class="flex justify-end">
          <button id="startGameBtn" class="px-6 py-2 bg-green-500 hover:bg-green-400 text-black font-bold rounded shadow-[0_0_15px_rgba(34,197,94,0.4)] transition disabled:opacity-50 disabled:cursor-not-allowed">
            Mulai Game
          </button>
        </div>
      </div>

      <div class="mt-6 text-xs text-gray-400 text-center">
        Mode: P2P Chase & Outsmart / Dalang Mode
      </div>

      <div class="mt-4 flex justify-center">
        <button id="audioBtn" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded text-sm border border-gray-600 transition">
          🔊 Nyalakan Audio
        </button>
      </div>
    </div>
  </div>

  <!-- Game Canvas -->
  <div id="gameContainer" class="fixed inset-0 z-20 hidden bg-black">
    <div class="relative w-full h-full">
      <canvas id="gameCanvas" class="block w-full h-full"></canvas>

      <div class="absolute top-4 left-4 right-4 flex justify-between items-start z-30 pointer-events-none">
        <div class="pointer-events-auto bg-black/60 backdrop-blur px-4 py-2 rounded border border-yellow-500/30">
          <div class="text-xs text-yellow-400 font-mono">Skor: <span id="hudScore">0</span></div>
          <div class="text-xs text-yellow-400 font-mono">Waktu: <span id="hudTimer">0</span>s</div>
        </div>

        <div class="pointer-events-auto bg-black/60 backdrop-blur px-4 py-2 rounded border border-yellow-500/30 text-center">
          <div class="text-xs text-yellow-400 font-mono">Room: <span id="hudRoom">-</span></div>
          <div class="text-xs text-yellow-400 font-mono">Karakter: <span id="hudCharacter">-</span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Narrative Story Scene (Phase 6) -->
  <div id="narrativeScene" class="fixed inset-0 z-30 hidden flex flex-col items-center justify-center bg-black/95 backdrop-blur-sm">
    <div id="narrativeContainer" class="w-full max-w-2xl h-full flex flex-col items-center justify-center p-6"></div>
  </div>

  <!-- Story Mode Canvas -->
  <div id="storyContainer" class="fixed inset-0 z-30 hidden bg-black">
    <canvas id="storyCanvas" class="block w-full h-full"></canvas>
    <div id="storyUi" class="absolute bottom-8 left-8 right-8 z-40 pointer-events-none">
      <div id="storyHint" class="text-center text-yellow-400 text-sm font-mono pointer-events-auto"></div>
    </div>
  </div>

  <!-- Piwulang / Moral Screen (Phase 7.1) -->
  <div id="piwulangScreen" class="fixed inset-0 z-50 hidden flex flex-col items-center justify-center bg-black/95 backdrop-blur-sm">
    <div class="bg-gray-900/90 backdrop-blur-md p-8 rounded-2xl border border-yellow-500/30 shadow-[0_0_40px_rgba(255,213,79,0.2)] w-full max-w-lg text-center">
      <h2 id="piwulangTitle" class="text-3xl font-black text-yellow-300 mb-4 drop-shadow-[0_0_15px_rgba(255,255,255,0.3)]">Piwulang</h2>
      <div id="piwulangStory" class="text-gray-300 text-lg italic mb-6 leading-relaxed"></div>
      <div id="piwulangMoral" class="text-yellow-200 text-xl font-bold italic mb-8 border-t border-yellow-500/30 pt-6"></div>
      <div id="piwulangEnding" class="text-gray-400 text-sm mb-8"></div>
      <button id="piwulangStartBtn" class="px-8 py-3 bg-yellow-500 hover:bg-yellow-400 text-black font-bold rounded shadow-[0_0_15px_rgba(255,213,79,0.4)] transition">
        Mulai Game
      </button>
    </div>
  </div>

  <!-- Game Over -->
  <div id="gameOver" class="fixed inset-0 z-40 hidden flex flex-col items-center justify-center bg-black/90 backdrop-blur-sm">
    <h2 class="text-4xl font-black text-red-400 mb-4 drop-shadow-[0_0_15px_rgba(255,0,0,0.5)]">GAME OVER</h2>
    <div id="finalScores" class="text-xl text-yellow-300 mb-6"></div>
    <div id="moralStory" class="max-w-lg text-center text-gray-300 italic mb-8"></div>
    <button id="playAgainBtn" class="px-8 py-3 bg-yellow-500 hover:bg-yellow-400 text-black font-bold rounded shadow-[0_0_15px_rgba(255,213,79,0.4)] transition">
      Main Lagi
    </button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
