<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b09" />
  <title>Kelir Sedang Sunyi — Wayang Kancil</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #e9d8ad; background: radial-gradient(circle at 70% 20%, #342313, #0b0b09 58%); font-family: ui-monospace, monospace; }
    main { width: min(100%, 560px); padding: clamp(32px, 8vw, 64px); border: 1px solid rgba(233,216,173,.22); border-top: 3px solid #e46f2b; background: rgba(15,13,10,.86); }
    small { color: #e46f2b; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 20px 0; font: 400 clamp(2.7rem, 10vw, 5rem)/.9 Georgia, serif; letter-spacing: -.05em; }
    p { color: rgba(233,216,173,.68); line-height: 1.7; }
    button { margin-top: 20px; padding: 15px 22px; border: 0; background: #e46f2b; color: #160d08; font: 800 11px monospace; letter-spacing: .12em; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <small>Mode offline</small>
    <h1>Kelir sedang sunyi.</h1>
    <p>Halaman utama tetap tersimpan, tetapi ruang multiplayer membutuhkan sambungan internet. Sambungkan kembali jaringan untuk melanjutkan lakon.</p>
    <button type="button" onclick="location.reload()">COBA LAGI</button>
  </main>
</body>
</html>
